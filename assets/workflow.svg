<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>viral-outline-generator 工作流</title>
  <desc>输入选题与平台长度，生成开头钩子、主体结构、素材清单与结尾 CTA。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="th" x="340" y="40" text-anchor="middle" fill="#185FA5" style="font-size:15px; font-weight:500">输入：1 条选题 + 平台 + 长度</text>

  <g class="node c-blue">
    <rect x="40" y="80" width="180" height="44" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="t" x="130" y="102" text-anchor="middle" fill="#042C53" style="font-size:13px">单条选题（带角度标签）</text>
  </g>
  <g class="node c-blue">
    <rect x="240" y="80" width="160" height="44" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="t" x="320" y="102" text-anchor="middle" fill="#042C53" style="font-size:13px">平台：公众号/小红书…</text>
  </g>
  <g class="node c-blue">
    <rect x="420" y="80" width="160" height="44" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="t" x="500" y="102" text-anchor="middle" fill="#042C53" style="font-size:13px">长度：短/中/长</text>
  </g>

  <path class="arr" d="M130 130 L130 160 M320 130 L320 160 M500 130 L500 160 M130 160 L500 160 L500 180" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path class="arr" d="M310 200 L370 200" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="node c-purple">
    <rect x="240" y="180" width="140" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/>
    <text class="th" x="310" y="200" text-anchor="middle" fill="#26215C" style="font-size:13px; font-weight:500">3 开头钩子</text>
    <text class="ts" x="310" y="218" text-anchor="middle" fill="#3C3489" style="font-size:11px">场景 · 反差 · 数字</text>
  </g>

  <path class="arr" d="M450 208 L490 208" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="node c-amber">
    <rect x="490" y="180" width="140" height="56" rx="8" stroke-width="0.5" fill="#FAEEDA" stroke="#BA7517"/>
    <text class="th" x="560" y="200" text-anchor="middle" fill="#412402" style="font-size:13px; font-weight:500">主体结构</text>
    <text class="ts" x="560" y="218" text-anchor="middle" fill="#633806" style="font-size:11px">3 / 5 / 7 节</text>
  </g>

  <path class="arr" d="M310 240 L310 270" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="node c-teal">
    <rect x="40" y="270" width="600" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="th" x="340" y="292" text-anchor="middle" fill="#04342C" style="font-size:13px; font-weight:500">关键素材清单 + 1 个结尾 CTA</text>
  </g>
</svg>
